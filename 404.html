<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Redirecting — Ashit Gandhi Photography</title>
<script>
  (function() {
    var path = window.location.pathname;
    // Paths that live on the Wix blog subdomain
    var wixPrefixes = ['/post/', '/portfolio-', '/portfolio', '/yearbook-', '/calendars', '/photowalls', '/copy-of-calendars', '/composite-images'];
    // /home/ → root
    if (path === '/home/' || path === '/home') { window.location.replace('https://www.ashitgphotography.com/'); return; }
    var isWix = wixPrefixes.some(function(p) { return path.indexOf(p) === 0; });
    if (isWix) {
      window.location.replace('https://blog.ashitgphotography.com' + path + window.location.search);
    } else {
      window.location.replace('https://www.ashitgphotography.com' + path);
    }
  })();
</script>
<meta http-equiv="refresh" content="0; url=https://www.ashitgphotography.com/" />
<style>
  body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #111; color: #fff; }
  p { opacity: 0.6; }
</style>
</head>
<body>
<p>Redirecting…</p>
</body>
</html>
